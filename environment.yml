# conda env create -f environment.yml          (update: conda env update -f environment.yml --prune)
# conda activate makeuc-eye
name: makeuc-eye
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - mediapipe>=1.2,<2        # Tasks API (FaceLandmarker); no legacy mp.solutions
      - opencv-python>=4.10
      - numpy>=2.0
      - pynput>=1.8
      - screeninfo>=0.8
      - pyserial>=3.5            # Arduino tap sensor (handsfree/jaw_clicker.py)
      - matplotlib>=3.8          # tools/tap_plot.py graph
